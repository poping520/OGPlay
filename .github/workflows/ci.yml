name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Initialize source dependencies
        run: >-
          git submodule update --init --recursive --
          third_party/doctest third_party/SDL third_party/dynarmic
          third_party/ext-boost third_party/boost-pool

      - name: Initialize ANGLE prebuilt SDK (Windows)
        if: runner.os == 'Windows'
        run: >-
          git submodule update --init --depth 1 --
          third_party/angle-prebuilt

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64
          -DOGPLAY_BUILD_TESTS=ON -DOGPLAY_WARNINGS_AS_ERRORS=ON
          -DOGPLAY_ENABLE_ANGLE=ON

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --preset ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build/ci --config RelWithDebInfo --parallel

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build --preset ci --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build/ci -C RelWithDebInfo --output-on-failure
        env:
          OGPLAY_CAPABILITY_BASE: HEAD^

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --preset ci
        env:
          OGPLAY_CAPABILITY_BASE: HEAD^
