# DexVM pilot (WU-M9-019): schema v2, dex_activity lifecycle.
# No native_call, no [[java.class]] — the interpreted DEX drives the title
# (docs/design/dexvm/04-integration.md §7). Migrated from v1 after the
# title-flow gate passed 3/3 with the identical Main Menu golden.
schema = 2
[identity]
package = "com.gameloft.android.GAND.GloftAsphalt5.asphalt5"
name = "Asphalt 5"
version_code = [1]
so_sha256 = ["9c7eea1374b76200f47557415f4518535cce065a0d2c50c7bab75209f7b87b48"]
abi = "armeabi"
[runtime]
api_level = 19
lifecycle = "dex_activity"
[runtime.surface]
width = 800
height = 480
# 512 MiB: resource bytes flow through interpreted GLResLoader as transient
# byte arrays; GC-A never reclaims (04 §5), so the budget must cover the
# cumulative allocation until GC-B lands (stage 4). Measured: title flow +
# language switch + race load peak below 300 MiB.
[runtime.dexvm]
heap_budget_bytes = 536870912
max_frames = 512
ticks_per_call = 200000000
[quirks]
enabled = ["gles1_material_front_face"]
[quirks.gles1_material_front_face]
