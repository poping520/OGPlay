# Exact identity extracted from the original APK; no Title Profile exists.
# Baseline progress only; frame/no-fault assertions do not certify visual correctness.
schema = 1
id = "asphalt5.basic"

[profile]
package = "com.gameloft.android.GAND.GloftAsphalt5.asphalt5"
version_code = 1
so_sha256 = "9c7eea1374b76200f47557415f4518535cce065a0d2c50c7bab75209f7b87b48"
abi = "armeabi"

[[fixture]]
id = "asphalt5.apk"
kind = "apk"
required = true

[limits]
startup_frames = 100
startup_ticks = 10000000000
startup_wall_time_ms = 120000
total_frames = 100100
total_ticks = 20000000000
total_wall_time_ms = 360000

[[checkpoint]]
id = "baseline"
provider = "frame"
max_frames = 100000
max_ticks = 10000000000
wall_time_ms = 240000
evidence = ["frame", "state", "logs"]

[checkpoint.action]
type = "step"
frames = 1

[[checkpoint.assertion]]
type = "frame"
minimum_sequence = 600

[[checkpoint.assertion]]
type = "no_guest_fault"
