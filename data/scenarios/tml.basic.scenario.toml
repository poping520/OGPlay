# Exact identity extracted from the original APK; no Title Profile exists.
# Baseline progress only; frame/no-fault assertions do not certify visual correctness.
schema = 1
id = "tml.basic"

[profile]
package = "com.amazon.games.tilmorningslight"
version_code = 1
so_sha256 = "8e232d2bc5990bd52b31ff0af14ce30dd6e3b2197ad916c430d42890dfc15fa3"
abi = "armeabi-v7a"

[[fixture]]
id = "tml.apk"
kind = "apk"
required = true

[limits]
startup_frames = 100
startup_ticks = 10000000000
startup_wall_time_ms = 120000
total_frames = 100100
total_ticks = 20000000000
total_wall_time_ms = 360000

[[checkpoint]]
id = "baseline"
provider = "frame"
max_frames = 100000
max_ticks = 10000000000
wall_time_ms = 240000
evidence = ["frame", "state", "logs"]

[checkpoint.action]
type = "step"
frames = 1

[[checkpoint.assertion]]
type = "frame"
minimum_sequence = 1800

[[checkpoint.assertion]]
type = "no_guest_fault"
