# Exact identity extracted from the original APK; no Title Profile exists.
# Baseline progress only; frame/no-fault assertions do not certify visual correctness.
schema = 1
id = "wild_blood.basic"

[profile]
package = "com.gameloft.android.GAND.GloftWBSS"
version_code = 10420
so_sha256 = "e43bb34b25c062f69607250525c36654884f6308f2246c21cfbd78e68f384522"
abi = "armeabi-v7a"

[[fixture]]
id = "wild_blood.apk"
kind = "apk"
required = true

[[fixture]]
id = "wild_blood.external"
kind = "external"
required = true

[limits]
startup_frames = 100
startup_ticks = 10000000000
startup_wall_time_ms = 120000
total_frames = 100100
total_ticks = 20000000000
total_wall_time_ms = 360000

[[checkpoint]]
id = "baseline"
provider = "frame"
max_frames = 100000
max_ticks = 10000000000
wall_time_ms = 240000
evidence = ["frame", "state", "logs"]

[checkpoint.action]
type = "step"
frames = 1

[[checkpoint.assertion]]
type = "frame"
minimum_sequence = 1200

[[checkpoint.assertion]]
type = "no_guest_fault"
