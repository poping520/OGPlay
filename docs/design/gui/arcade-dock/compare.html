<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Arcade Dock · 固定尺寸对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#282d29;color:#f4f5ee;font:14px "Segoe UI","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:5;padding:12px 18px;background:#17221fee;display:flex;align-items:center;gap:18px;flex-wrap:wrap}button,select,input{font:inherit}button,select{padding:5px 10px}label{display:flex;gap:8px;align-items:center}main{width:1672px;height:941px;position:relative;margin:16px}iframe,img{position:absolute;inset:0;width:1672px;height:941px;border:0}iframe{pointer-events:none}#reference{pointer-events:none;opacity:.5}main.gray{filter:grayscale(1)}main.difference #reference{mix-blend-mode:difference;opacity:1!important}p{margin:10px 18px;color:#bbc8bc}
</style>
<header><strong>1672 × 941 · 100%</strong><select id="mode" aria-label="对照方式"><option value="overlay">叠加</option><option value="split">左右划分</option><option value="current">当前页面</option><option value="reference">原图</option><option value="difference">差异</option></select><label>原图比例 <input id="amount" type="range" min="0" max="100" value="50"><output id="value">50%</output></label><label><input type="checkbox" id="gray">灰度检查明暗</label><label>选择参考图<input id="file" type="file" accept="image/*"></label></header>
<p>浏览器缩放设为 100%。页面不缩放，小窗口可滚动。封面、图标与字体差异不作为外壳材质误差；差异视图不代表相似度评分。</p>
<main id="canvas"><iframe src="index.html?compare=1" title="当前页面 1672×941" tabindex="-1"></iframe><img id="reference" src="source/library-2.png" alt="原效果图"></main>
<script>
const mode=document.getElementById('mode'), amount=document.getElementById('amount'), ref=document.getElementById('reference'), canvas=document.getElementById('canvas');
function update(){const m=mode.value,n=Number(amount.value);canvas.classList.toggle('difference',m==='difference');ref.style.opacity=m==='current'?0:m==='overlay'?n/100:1;ref.style.clipPath=m==='split'?`inset(0 ${100-n}% 0 0)`:'none';document.getElementById('value').textContent=n+'%';}
mode.addEventListener('change',update);amount.addEventListener('input',update);document.getElementById('gray').addEventListener('change',e=>canvas.classList.toggle('gray',e.target.checked));
let imageUrl;document.getElementById('file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const next=URL.createObjectURL(file),probe=new Image();probe.onload=()=>{if(probe.naturalWidth!==1672||probe.naturalHeight!==941){URL.revokeObjectURL(next);alert('请选择 1672×941 的参考图，避免缩放干扰对照。');return;}if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=next;ref.src=next;};probe.onerror=()=>{URL.revokeObjectURL(next);alert('参考图无法读取。');};probe.src=next;});update();
</script></html>
