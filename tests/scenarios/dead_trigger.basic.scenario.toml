# Exact identity extracted from the original APK; no Title Profile exists.
# Baseline progress only; frame/no-fault assertions do not certify visual correctness.
schema = 1
id = "dead_trigger.basic"

[profile]
package = "com.madfingergames.deadtrigger"
version_code = 10000110
so_sha256 = "3295e5020981445adc96a7f26bde760224e77b3d6e895c92cc3c9e466528ec80"
abi = "armeabi-v7a"

[[fixture]]
id = "dead_trigger.apk"
kind = "apk"
required = true

[[fixture]]
id = "dead_trigger.obb"
kind = "obb"
required = true

[limits]
startup_frames = 100
startup_ticks = 10000000000
startup_wall_time_ms = 120000
total_frames = 100100
total_ticks = 20000000000
total_wall_time_ms = 360000

[[checkpoint]]
id = "baseline"
provider = "frame"
max_frames = 100000
max_ticks = 10000000000
wall_time_ms = 240000
evidence = ["frame", "state", "logs"]

[checkpoint.action]
type = "step"
frames = 1

[[checkpoint.assertion]]
type = "frame"
minimum_sequence = 1200

[[checkpoint.assertion]]
type = "no_guest_fault"
