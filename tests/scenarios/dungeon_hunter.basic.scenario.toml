# Exact identity extracted from the original APK; no Title Profile exists.
# Baseline progress only; frame/no-fault assertions do not certify visual correctness.
schema = 1
id = "dungeon_hunter.basic"

[profile]
package = "com.gameloft.android.GAND.GloftDUNQ.DungeonHunter"
version_code = 355
so_sha256 = "0befcb71acc320c964a08a590dd7b1903a91421c7c52c01ede2f19a1771b247a"
abi = "armeabi"

[[fixture]]
id = "dungeon_hunter.apk"
kind = "apk"
required = true

[[fixture]]
id = "dungeon_hunter.external"
kind = "external"
required = true

[limits]
startup_frames = 100
startup_ticks = 10000000000
startup_wall_time_ms = 120000
